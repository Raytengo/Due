<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Due</title>
  <style>
    /* 本地字體：打包於 fonts/，取代 Google Fonts 外部載入（popup 僅用 DM Sans / DM Mono） */
    @font-face {
      font-family: 'DM Sans';
      font-style: normal;
      font-weight: 300;
      font-display: swap;
      src: url('fonts/dmsans-300.woff2') format('woff2');
    }

    @font-face {
      font-family: 'DM Sans';
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url('fonts/dmsans-400.woff2') format('woff2');
    }

    @font-face {
      font-family: 'DM Mono';
      font-style: normal;
      font-weight: 300;
      font-display: swap;
      src: url('fonts/dmmono-300.woff2') format('woff2');
    }

    @font-face {
      font-family: 'DM Mono';
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url('fonts/dmmono-400.woff2') format('woff2');
    }

    :root {
      --bg: #f2f0e8;
      --surface: #f2f0e8;
      --dark: #141413;
      --mid: #6c685e;
      --muted: #63605a;
      --border: #dedad0;
      --orange: #d97757;
      --blue: #6a9bcc;
      --green: #788c5d;
      --warm: #b09050;
      --purple: #a86070;
      --overdue: #b3452c;
      --urgent: #c4381e;   /* 今天到期 badge 的實心紅：比 --overdue 更飽和（#21 重新設計 C1） */

      /* 動效 token（與 dashboard 同一組；Animate UI token 換算成 CSS，spring 為 css-timing 轉出的 linear()）。
         同一種角色只用一個值，之後不再手寫時長。 */
      --t-color: 200ms cubic-bezier(0.25, 0.1, 0.25, 1);        /* transition.color：hover 換色、底色 */
      --t-fade: 200ms cubic-bezier(0.23, 1, 0.32, 1);           /* transition.fade：原地淡入淡出 */
      --t-swap: 150ms cubic-bezier(0.23, 1, 0.32, 1);           /* transition.swap：標籤交換（搭 blur 2px） */
      --t-reveal: 300ms cubic-bezier(0.23, 1, 0.32, 1);         /* transition.reveal */
      --t-disclosure: 350ms cubic-bezier(0.215, 0.61, 0.355, 1); /* transition.disclosure（ease.soft） */
      --t-menu: 220ms cubic-bezier(0.215, 0.61, 0.355, 1);      /* transition.menu（ease.soft） */
      --t-check: 300ms cubic-bezier(0, 0, 0.58, 1);             /* transition.check：勾號畫出（ease.draw；delay 200ms 另寫） */
      --spring-press: 400ms linear(0, 0.0261, 0.0935, 0.188, 0.2977, 0.4132, 0.5271, 0.6343, 0.7313, 0.8159, 0.8872, 0.9452, 0.9906, 1.0244, 1.048, 1.063, 1.0709, 1.0732, 1.0713, 1.0663, 1.0594, 1.0514, 1.0429, 1.0346, 1.0267, 1.0196, 1.0134, 1.0082, 1.004, 1.0007, 0.9982, 0.9965, 1, 0.9948, 0.9946, 0.9948, 1, 1, 1, 1);
      --spring-highlight: 300ms linear(0, 0.0233, 0.0813, 0.1598, 0.2483, 0.3396, 0.4288, 0.5126, 0.5894, 0.658, 0.7183, 0.7704, 0.8149, 0.8524, 0.8837, 0.9094, 0.9303, 0.9472, 0.9607, 0.9713, 0.9796, 0.986, 0.9908, 0.9944, 0.997, 0.9988, 1.0001, 1.001, 1.0015, 1);
      --reflow: var(--spring-highlight);                        /* spring.reflow（500/40，同 highlight）：空隙收合 */
      --spring-selection: 500ms linear(0, 0.0141, 0.0509, 0.1035, 0.1663, 0.2349, 0.306, 0.3769, 0.4459, 0.5115, 0.573, 0.6297, 0.6814, 0.728, 0.7696, 0.8064, 0.8387, 0.8668, 0.8911, 0.9119, 0.9296, 0.9445, 0.957, 0.9673, 0.9758, 0.9827, 0.9882, 0.9926, 0.9961, 0.9987, 1.0007, 1.0021, 1.0031, 1.0038, 1.0041, 1, 1, 1, 1.004, 1.0038, 1.0035, 1.0032, 1.0029, 1.0026, 1.0023, 1.002, 1.0017, 1.0015, 1, 1);
      --ring: 800ms cubic-bezier(0.16, 1, 0.3, 1);              /* 進度環（使用者拍板，只命名） */
      --scale-press: 0.97;                                       /* scale.press：按鈕按住 */
      --scale-choice: 0.985;                                     /* scale.choice：整卡/整列按住 */
    }

    /* 減少動態：拿掉縮放（按壓回饋改由顏色承擔）；其餘位移類動效在各自規則旁處理 */
    @media (prefers-reduced-motion: reduce) {
      :root {
        --scale-press: 1;
        --scale-choice: 1;
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* 無障礙：鍵盤聚焦可見外框（僅 :focus-visible，滑鼠點擊不顯示）。
       outline 不列進任何 transition：焦點框必須在聚焦那一幀就完整出現（#26） */
    .task-check:focus-visible,
    .task-name.clickable:focus-visible,
    .usage-chip:focus-visible,
    .usage-refresh:focus-visible,
    .btn:focus-visible {
      outline: 2px solid var(--orange);
      outline-offset: 2px;
    }

    body {
      width: 320px;
      background: var(--bg);
      color: var(--dark);
      font-family: 'DM Sans', sans-serif;
      font-weight: 300;
      padding: 18px 18px 14px;
      margin: 0;
    }

    .popup-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }

    .usage-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .section-label {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
    }

    /* hover 不再上浮（上浮是卡片 surface 的語言）；按下時以 spring.press 縮到 scale.press（#24） */
    .usage-chip {
      display: inline-grid;   /* 文字層疊在同一格，手動刷新時新舊數字交叉淡換（#49） */
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.35);
      color: var(--dark);
      border-radius: 999px;
      padding: 4px 8px;
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      line-height: 1;
      letter-spacing: 0.04em;
      white-space: nowrap;
      cursor: pointer;
      transition: border-color var(--t-color), color var(--t-color), background-color var(--t-color), scale var(--spring-press);
    }

    .usage-chip .chip-txt {
      grid-area: 1 / 1;
      transition: opacity var(--t-swap), filter var(--t-swap);
    }

    /* 交換中：進來的從 opacity 0 + blur(2px) 開始，出去的淡到同一狀態（transition.swap + blur.icon） */
    .usage-chip .chip-txt.in,
    .usage-chip .chip-txt.out {
      opacity: 0;
      filter: blur(2px);
    }

    .usage-chip.usage-high {
      background: rgba(217, 119, 87, 0.08);
      border-color: rgba(217, 119, 87, 0.4);
      color: var(--orange);
    }

    .usage-chip.usage-full {
      background: rgba(224, 90, 71, 0.08);
      border-color: rgba(224, 90, 71, 0.4);
      color: #e05a47;
    }

    .usage-chip.is-empty {
      color: var(--muted);
    }

    .usage-refresh {
      width: 20px;
      height: 20px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      border-radius: 999px;
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      line-height: 1;
      cursor: pointer;
      transition: border-color var(--t-color), color var(--t-color), opacity var(--t-fade), scale var(--spring-press);
    }

    /* 忙碌：用 aria-disabled（不用 disabled），鍵盤觸發時焦點不會掉到 body */
    .usage-refresh[aria-disabled="true"] {
      opacity: 0.45;
      cursor: progress;
    }

    /* ↻ 本身就是忙碌指示：原地轉圈（loading 是唯一保有意義的 loop），不再一幀換成「...」（#49） */
    .refresh-glyph {
      display: inline-block;
    }

    .usage-refresh.is-busy .refresh-glyph {
      animation: refresh-spin 800ms linear infinite;
    }

    @keyframes refresh-spin {
      to { transform: rotate(360deg); }
    }

    @keyframes refresh-pulse {
      50% { opacity: 0.4; }
    }

    .usage-chip:active,
    .usage-refresh:active:not([aria-disabled="true"]),
    .btn:active {
      scale: var(--scale-press);
    }

    /* ↻ 抓不到用量時的短暫提示（數秒後清空）。空字串時高度為 0、不佔版面；
       live region 常駐不隱藏，螢幕閱讀器才會念出新內容 */
    .usage-note {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      line-height: 1.4;
      color: var(--muted);
      text-align: right;
      text-wrap: balance;   /* 英文長句折兩行時平均分配，避免單字孤行 */
    }

    .usage-note:not(:empty) {
      margin: -4px 0 8px;
    }

    /* 超過 3 筆即內部捲動，避免 popup 過長。實際高度由 popup.js 的 fitTaskListHeight 量出
       （停在第 3 筆的下緣，不露半列）；188px 只是 JS 量好之前的上限。
       左右各留 4px 給勾選圈的焦點框與 hover halo（否則被捲動容器裁掉左側，#4）；內容寬維持 284px */
    .task-list {
      list-style: none;
      margin: 0 -4px;
      padding: 0 4px;
      max-height: 188px;
      overflow-y: auto;
    }

    .task-list::-webkit-scrollbar {
      width: 3px;
    }

    .task-list::-webkit-scrollbar-track {
      background: transparent;
    }

    .task-list::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 2px;
    }

    .task-item {
      position: relative;   /* 撤銷倒數條以列為定位基準（#23） */
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 7px 0;
      border-bottom: 1px solid var(--border);
      transition: background-color var(--t-color);
    }

    .task-item:last-child {
      border-bottom: none;
    }

    /* 可開啟 Canvas 連結的列：整列可點（勾選圈除外），hover 提示（底色見下方 hover 區塊）。
       不用負 margin（會撐出水平捲軸）；hover 底色沿列的完整寬度即可。 */
    .task-item.openable {
      cursor: pointer;
    }

    /* 完成過渡：撤銷窗口內內文淡到 0.5（與勾選圈填色同一個節奏，#36；過渡寫在 .task-body） */
    .task-item.completing .task-body {
      opacity: 0.5;
    }

    /* 撤銷倒數條：列底部 3px 橘條 1.5 秒線性縮到 0（同 dashboard 的 complete-countdown）。
       absolute 疊在列內，列尺寸不變、其他列不被推動（#23）；長度由 JS 帶入 COMPLETE_DELAY_MS */
    .complete-countdown {
      position: absolute;
      left: 0;
      bottom: 0;
      width: 100%;
      height: 3px;
      background: var(--orange);
      transform-origin: left;
      animation: complete-countdown linear forwards;
      pointer-events: none;
    }

    @keyframes complete-countdown {
      from { transform: scaleX(1); }
      to { transform: scaleX(0); }
    }

    /* 收合：列與組標題同一條規則（#35）。淡出走 transition.fade，高度與 padding 走 spring.reflow，
       兩條曲線分開；JS 在 transitionend(max-height) 移除 */
    .task-item.collapsing,
    .task-group-label.collapsing {
      overflow: hidden;
      transition: opacity var(--t-fade), max-height var(--reflow), padding var(--reflow);
    }

    /* 撤銷倒數歸零時從勾選圈中心迸出的碎點（同 dashboard 的 complete-dot，距離縮成 16–24px 配合 popup 列高）。
       掛在 body 下的 fixed 圖層，不放進列裡：列的 overflow:hidden 與淡出會把碎點一起裁掉/抹掉 */
    #burst-layer {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 50;
    }

    .complete-burst-dot {
      position: absolute;
      width: 7px;
      height: 7px;
      margin: -3.5px 0 0 -3.5px;
      border-radius: 50%;
      pointer-events: none;
      animation: complete-dot 0.5s ease-out forwards;
    }

    @keyframes complete-dot {
      to { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(0.3); }
    }

    /* 分組小標題（比照 .section-label；逾期版用 var(--overdue)）*/
    .task-group-label {
      list-style: none;
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      padding: 10px 0 5px;
      border-bottom: none;
    }

    .task-group-label:first-child {
      padding-top: 2px;
    }

    .task-group-label.overdue {
      color: var(--overdue);
    }

    /* 左側完成勾選圈：中性空心圓（沿用 dashboard assignment-check 語言）
       → hover 綠框＋淡綠底＋halo（提示可勾）→ 完成綠底白勾。緊急度色改由右側 badge 承載，不再雙重編碼。 */
    .task-check {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      flex-shrink: 0;
      padding: 0;
      border: 1.5px solid var(--mid);
      background: transparent;
      appearance: none;
      -webkit-appearance: none;
      cursor: pointer;
      position: relative;
      transition: background-color var(--t-color), border-color var(--t-color), box-shadow var(--t-color);
    }

    /* 隱形擴大熱區：16px → 約 26px，差一點沒點中不會落到列上去開 Canvas（#22，同 dashboard 的做法）。
       與名稱間距 9px，-6px 不會壓到字；::after 已用來畫勾 */
    .task-check::before {
      content: '';
      position: absolute;
      inset: -6px;
      border-radius: 50%;
    }

    .task-check::after {
      content: '';
      position: absolute;
      left: 4.5px;
      top: 2.5px;
      width: 3px;
      height: 6px;
      border: solid #fff;
      border-width: 0 1.5px 1.5px 0;
      transform: rotate(45deg);
      opacity: 0;
      transition: opacity var(--t-fade);
    }

    /* 勾選後的撤銷窗口：綠底白勾。底色在點下那一幀開始填，勾號等填色後 200ms 再由短邊到長邊畫出（#46，transition.check）。
       popup 只有在撤銷窗內才會出現 .done，不需另做 just-checked */
    .task-check.done {
      background: var(--green);
      border-color: var(--green);
    }

    .task-check.done::after {
      opacity: 1;
      animation: check-draw var(--t-check) 200ms both;
    }

    @keyframes check-draw {
      from { clip-path: inset(100% 0 0 0); }
      to { clip-path: inset(0); }
    }

    .task-body {
      flex: 1;
      min-width: 0;
      transition: opacity var(--t-fade);
    }

    .task-name {
      font-size: 14px;
      font-weight: 500;
      color: var(--dark);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.4;
      transition: color var(--t-color);   /* 底線維持即時，只有顏色過渡（#37） */
    }

    .task-name.clickable {
      cursor: pointer;
    }

    .task-meta {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      font-weight: 500;
      color: var(--muted);
      margin-top: 1px;
    }

    /* 右側到期 badge：柔色 chip（tint 底 + accent 字 + 淡框），三層緊急度。
       內含兩個標籤：到期文字（.lbl-due）與「↩ 撤銷」（.lbl-undo，疊在上面）。
       換成撤銷時兩者交叉淡換（opacity＋blur 2px），寬度只在撤銷窗內由 JS 釘住並 150ms 滑過去（#36） */
    .task-due {
      position: relative;
      display: inline-flex;
      align-items: center;
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      font-weight: 500;
      flex-shrink: 0;
      padding: 2px 8px;
      border-radius: 999px;
      border: 1px solid transparent;
      white-space: nowrap;
      transition: background-color var(--t-swap), border-color var(--t-swap), color var(--t-swap), width var(--t-swap);
    }

    /* 寬度被釘住期間（撤銷窗內與換回途中）裁掉比 badge 寬的那個標籤，避免撐出清單的水平捲動 */
    .task-due.pinned {
      overflow: hidden;
    }

    .task-due .lbl {
      display: inline-flex;
      align-items: center;
      transition: opacity var(--t-swap), filter var(--t-swap);
    }

    /* 靠右對齊（padding-right 各狀態都是 8px）：比 badge 寬時往左（列內）溢出，不會撐出清單的水平捲動；
       平常透明且不吃指標，不擋名稱的 hover／點擊 */
    .task-due .lbl-undo {
      position: absolute;
      right: 8px;
      top: 0;
      bottom: 0;
      opacity: 0;
      filter: blur(2px);
      pointer-events: none;
    }

    .task-due.undo .lbl-due {
      opacity: 0;
      filter: blur(2px);
    }

    .task-due.undo .lbl-undo {
      opacity: 1;
      filter: none;
    }

    /* 今天到期（最燙）：實心紅底＋白字＋白色單色火焰（#21 重新設計 C1；不用漸層、不用光暈） */
    .task-due.today {
      background: var(--urgent);
      color: #fff;
      border-color: var(--urgent);
      padding-left: 6px;
    }

    .task-due .flame {
      width: 9px;
      height: 11px;
      margin-right: 4px;
      flex-shrink: 0;
      transform-origin: 50% 100%;
    }

    .task-due .flame path {
      fill: currentColor;
    }

    /* 火焰「跳」：往上竄（拉長＋上移）→ 落下微壓扁 → 回原狀，一大一小兩跳一個循環；底部為原點不會飄走 */
    .task-due.today .flame {
      animation: flame-hop 1.1s ease-in-out infinite;
    }

    @keyframes flame-hop {
      0%, 100% { transform: translateY(0) scale(1, 1); }
      18% { transform: translateY(-1.2px) scale(0.92, 1.18); }
      34% { transform: translateY(0) scale(1.06, 0.9); }
      48% { transform: translateY(0) scale(1, 1); }
      62% { transform: translateY(-0.6px) scale(0.96, 1.09); }
      76% { transform: translateY(0) scale(1.03, 0.95); }
    }

    /* 3 天內（橘）*/
    .task-due.soon3 {
      background: color-mix(in srgb, var(--orange) 14%, transparent);
      color: var(--orange);
      border-color: color-mix(in srgb, var(--orange) 32%, transparent);
    }

    /* 4–7 天（琥珀，最緩；字色壓深補對比）*/
    .task-due.week7 {
      background: color-mix(in srgb, var(--warm) 16%, transparent);
      color: color-mix(in srgb, var(--warm) 82%, #000);
      border-color: color-mix(in srgb, var(--warm) 34%, transparent);
    }

    /* 已逾期（同今天的紅；區塊與文案已足以區分）*/
    .task-due.overdue {
      background: color-mix(in srgb, var(--overdue) 14%, transparent);
      color: var(--overdue);
      border-color: color-mix(in srgb, var(--overdue) 32%, transparent);
    }

    /* 撤銷 pill：橘字透明底 */
    .task-due.undo {
      background: transparent;
      color: var(--orange);
      border-color: transparent;
      cursor: pointer;
    }

    .empty-state {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      color: var(--mid);
      text-align: center;
      padding: 24px 0 20px;
    }

    /* 清單在使用中變空時才淡入；打開 popup 時本來就空的清單不帶 class，立即顯示（#35） */
    .empty-state.is-entering {
      transition: opacity var(--t-fade);
    }

    @starting-style {
      .empty-state.is-entering {
        opacity: 0;
      }
    }

    .divider {
      border: none;
      border-top: 1px solid var(--border);
      margin: 5px 0 12px;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 9px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--dark);
      color: var(--bg);
      font-family: 'DM Sans', sans-serif;
      font-weight: 300;
      font-size: 13px;
      cursor: pointer;
      text-align: center;
      transition: background-color var(--t-color), scale var(--spring-press);
    }

    /* hover 只給真的能 hover 的指標（滑鼠/觸控板）：觸控點一下不會把 hover 黏住（#11）。
       :focus-visible 與 :active 留在外面 */
    @media (hover: hover) and (pointer: fine) {
      .usage-chip:hover {
        border-color: var(--orange);
        color: var(--orange);
      }

      .usage-refresh:hover:not([aria-disabled="true"]) {
        border-color: var(--orange);
        color: var(--orange);
      }

      .task-item.openable:hover {
        background: rgba(217, 119, 87, 0.06);
      }

      .task-check:not(.done):hover {
        border-color: var(--green);
        background: color-mix(in srgb, var(--green) 12%, transparent);
        box-shadow: 0 0 0 4px color-mix(in srgb, var(--green) 10%, transparent);
      }

      .task-name.clickable:hover {
        color: var(--orange);
        text-decoration: underline;
      }

      .btn:hover {
        background: #2a2a27;
      }
    }

    /* 減少動態：留淡入淡出、顏色與撤銷倒數條（倒數是 meter 不是位移）；
       火焰停、↻ 改明暗呼吸（仍看得出「還在抓」）。收合只淡出、碎點略過、badge 寬度不滑動由 JS 判斷 */
    @media (prefers-reduced-motion: reduce) {
      .task-due .flame,
      .task-due.today .flame {
        animation: none;
      }

      .usage-refresh.is-busy .refresh-glyph {
        animation: refresh-pulse 1.2s ease-in-out infinite;
      }

      .task-item.collapsing,
      .task-group-label.collapsing {
        transition: opacity var(--t-fade);
      }

      /* badge 寬度直接到位（不滑動）；標籤淡換與顏色過渡保留 */
      .task-due {
        transition: background-color var(--t-swap), border-color var(--t-swap), color var(--t-swap);
      }
    }
  </style>
</head>

<body>
  <div class="popup-header">
    <div class="section-label" id="task-label">7 天內待辦</div>
    <div class="usage-actions">
      <button class="usage-chip is-empty" id="claude-usage-chip" type="button"><span class="chip-txt">CLAUDE --</span></button>
      <button class="usage-refresh" id="claude-usage-refresh" type="button" aria-disabled="false"
        title="Refresh Claude usage" aria-label="Refresh Claude usage"><span class="refresh-glyph" aria-hidden="true">&#8635;</span></button>
    </div>
  </div>
  <p class="usage-note" id="claude-usage-note" role="status" aria-live="polite"></p>
  <ul class="task-list" id="task-list"></ul>

  <hr class="divider" />
  <button class="btn" id="dashboard-btn">開啟 Dashboard</button>

  <script src="dashboard/taskRules.js"></script>
  <script src="dashboard/completion.js"></script>
  <script src="dashboard/customAssignments.js"></script>
  <script src="popup.js"></script>
</body>

</html>
